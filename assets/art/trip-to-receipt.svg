<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 300" role="img"
     aria-label="How a trip becomes a receipt: trip created, GPS fills the kilometres, FASTag fills the tolls, the driver adds bills, the receipt is sent and can be verified">
  <text x="2.0" y="54" fill="#E4E8EF" font-family="IBM Plex Serif, Georgia, serif"
        font-size="24" font-weight="500">How a trip becomes a receipt</text>
  
  <rect x="2.0" y="92" width="212" height="124" rx="16" fill="#FFFFFF" fill-opacity=".055"
        stroke="#E4E8EF" stroke-opacity="0.26" stroke-width="1.3"/>
  <text x="22.0" y="124" fill="#E4E8EF" fill-opacity="0.42"
        font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" letter-spacing="1.2">01</text>
  <text x="22.0" y="160" fill="#E4E8EF" font-family="IBM Plex Sans, sans-serif"
        font-size="17" font-weight="500">Trip created</text>
  <text x="22.0" y="186" fill="rgba(228,232,239,.6)" font-family="IBM Plex Sans, sans-serif" font-size="13">Vehicle, driver, from and to</text><path d="M223.0 154.0 H249.0" stroke="#E4E8EF" stroke-opacity=".3" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="236.0" cy="154.0" r="2.6" fill="#E4E8EF" fill-opacity=".45"/>
  <rect x="258.0" y="92" width="212" height="124" rx="16" fill="#FFFFFF" fill-opacity=".055"
        stroke="#E4E8EF" stroke-opacity="0.26" stroke-width="1.3"/>
  <text x="278.0" y="124" fill="#E4E8EF" fill-opacity="0.42"
        font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" letter-spacing="1.2">02</text>
  <text x="278.0" y="160" fill="#E4E8EF" font-family="IBM Plex Sans, sans-serif"
        font-size="17" font-weight="500">GPS fills the km</text>
  <text x="278.0" y="186" fill="rgba(228,232,239,.6)" font-family="IBM Plex Sans, sans-serif" font-size="13">Start and arrival detected</text><path d="M479.0 154.0 H505.0" stroke="#E4E8EF" stroke-opacity=".3" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="492.0" cy="154.0" r="2.6" fill="#E4E8EF" fill-opacity=".45"/>
  <rect x="514.0" y="92" width="212" height="124" rx="16" fill="#FFFFFF" fill-opacity=".055"
        stroke="#E4E8EF" stroke-opacity="0.26" stroke-width="1.3"/>
  <text x="534.0" y="124" fill="#E4E8EF" fill-opacity="0.42"
        font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" letter-spacing="1.2">03</text>
  <text x="534.0" y="160" fill="#E4E8EF" font-family="IBM Plex Sans, sans-serif"
        font-size="17" font-weight="500">FASTag fills tolls</text>
  <text x="534.0" y="186" fill="rgba(228,232,239,.6)" font-family="IBM Plex Sans, sans-serif" font-size="13">Charged to that vehicle</text><path d="M735.0 154.0 H761.0" stroke="#E4E8EF" stroke-opacity=".3" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="748.0" cy="154.0" r="2.6" fill="#E4E8EF" fill-opacity=".45"/>
  <rect x="770.0" y="92" width="212" height="124" rx="16" fill="#FFFFFF" fill-opacity=".055"
        stroke="#E4E8EF" stroke-opacity="0.26" stroke-width="1.3"/>
  <text x="790.0" y="124" fill="#E4E8EF" fill-opacity="0.42"
        font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" letter-spacing="1.2">04</text>
  <text x="790.0" y="160" fill="#E4E8EF" font-family="IBM Plex Sans, sans-serif"
        font-size="17" font-weight="500">Driver adds bills</text>
  <text x="790.0" y="186" fill="rgba(228,232,239,.6)" font-family="IBM Plex Sans, sans-serif" font-size="13">Photographed from the road</text><path d="M991.0 154.0 H1017.0" stroke="#E4E8EF" stroke-opacity=".3" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="1004.0" cy="154.0" r="2.6" fill="#E4E8EF" fill-opacity=".45"/>
  <rect x="1026.0" y="92" width="212" height="124" rx="16" fill="#FC8418" fill-opacity="1"
        stroke="#FC8418" stroke-opacity="0.9" stroke-width="1.3"/>
  <text x="1046.0" y="124" fill="#00186C" fill-opacity="0.55"
        font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="500" letter-spacing="1.2">05</text>
  <text x="1046.0" y="160" fill="#00186C" font-family="IBM Plex Sans, sans-serif"
        font-size="17" font-weight="500">Receipt sent</text>
  <text x="1046.0" y="186" fill="rgba(0,24,108,.72)" font-family="IBM Plex Sans, sans-serif" font-size="13">WhatsApp, UPI, check code</text>
  <line x1="40" y1="258" x2="1200" y2="258" stroke="#E4E8EF" stroke-opacity=".2" stroke-width="3" stroke-dasharray="22 18"/>
</svg>
